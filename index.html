<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hedgemaster</title>
<style>
  :root {
    --desk:#ccc3ae;        /* the counter the slip sits on */
    --slip:#f7f3e8;        /* ticket stock */
    --ink:#17130d;
    --faint:#8b8271;
    --rule:#cabfa6;
    --good:#2c6b4a;        /* stamp inks */
    --warn:#94660f;
    --bad:#a72f1c;
    --hi:#fbf0b6;          /* highlighter */
  }
  * { box-sizing: border-box; }
  body {
    margin:0; padding:20px 12px 48px;
    /* faint vertical fibre so the "paper" isn't a flat fill */
    background:
      repeating-linear-gradient(90deg, rgba(0,0,0,.02) 0 1px, transparent 1px 5px),
      var(--desk);
    color:var(--ink);
    font:13.5px/1.55 ui-monospace, "SF Mono", SFMono-Regular, "Cascadia Mono",
         Menlo, Consolas, monospace;
  }

  /* ---- masthead ---- */
  .head { max-width:560px; margin:0 auto 18px; }
  /* swelled rule: heavy over hairline, the classic masthead device */
  .swell { height:5px; border-top:4px solid var(--ink);
           border-bottom:1px solid var(--ink); }
  h1 { margin:11px 0 0; padding:17px 6px 15px; background:var(--ink);
       color:var(--slip); text-align:center; line-height:1;
       font-size:clamp(21px, 7.1vw, 34px); font-weight:800;
       letter-spacing:.26em; text-indent:.26em; text-transform:uppercase;
       white-space:nowrap; overflow:hidden;
       /* hairline rule inset from the edge — the engraved-certificate device */
       box-shadow:inset 0 0 0 4px var(--ink), inset 0 0 0 5px rgba(247,243,232,.45); }
  /* Second half knocked back to outline so the mark reads as one designed
     lockup rather than bold-plus-regular. Translucent fill is the fallback
     wherever text-stroke doesn't apply.
     Weight 400 rather than the 800 of the solid half: text-stroke is drawn
     CENTRED on the glyph outline, so half of it bites inward. Against bold
     letterforms that closes the tight counters — the M's notch and the A's
     apex silt up and go muddy. Opening the counters first, then stroking
     thinly, keeps both letters legible down to the smallest clamped size. */
  h1 .mk { font-weight:400; color:rgba(247,243,232,.22);
           -webkit-text-stroke:.8px var(--slip); }
  .meta { display:flex; justify-content:space-between; align-items:center;
          gap:8px; margin-top:7px; font-size:9px; letter-spacing:.17em;
          text-transform:uppercase; color:var(--faint); }
  .meta b { font-weight:700; color:var(--ink); }
  .orn { font-size:7px; color:var(--ink); letter-spacing:.4em; }

  /* ---- the slips ---- */
  .card { max-width:560px; margin:0 auto 16px; background:var(--slip);
          border:1px solid var(--rule); padding:18px 16px; position:relative; }
  /* half-circles punched along the top and bottom edges = tear perforation */
  .card::before, .card::after {
    content:''; position:absolute; left:0; right:0; height:9px;
    background-size:14px 9px; background-repeat:repeat-x; pointer-events:none;
  }
  .card::before { top:-1px;
    background-image:radial-gradient(circle at 50% 0, var(--desk) 0 4.5px, transparent 5px); }
  .card::after { bottom:-1px;
    background-image:radial-gradient(circle at 50% 100%, var(--desk) 0 4.5px, transparent 5px); }

  /* ---- form: fill-in-the-blank, not boxed widgets ---- */
  label { display:block; font-size:9.5px; letter-spacing:.14em;
          text-transform:uppercase; color:var(--faint); margin-bottom:2px; }
  input, select {
    width:100%; padding:5px 2px; background:transparent; color:var(--ink);
    border:0; border-bottom:1.5px solid var(--rule); border-radius:0;
    font:600 16px/1.3 inherit;   /* 16px keeps iOS from zooming on focus */
    -webkit-appearance:none; appearance:none;
  }
  select { background:transparent; }
  input:focus, select:focus { outline:none; background:var(--hi);
                              border-bottom-color:var(--ink); }

  #legs { counter-reset:leg; }
  .leg { display:grid; gap:10px 8px; grid-template-columns:1fr 92px;
         counter-increment:leg; padding:12px 0 14px;
         border-bottom:1px dashed var(--rule); }
  .leg .full { grid-column:1 / -1; }
  .legno::before { content:"— LEG " counter(leg) " —"; display:block;
                   font-size:9.5px; letter-spacing:.2em; color:var(--faint); }
  .row2 { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  label.spaced { margin-top:14px; }

  /* ---- buttons: ink block with a hard offset, no blur ---- */
  button { font:700 11px/1 inherit; letter-spacing:.16em; text-transform:uppercase;
           padding:11px 14px; color:var(--ink); background:var(--slip);
           border:2px solid var(--ink); border-radius:0; cursor:pointer;
           box-shadow:3px 3px 0 var(--ink); }
  button:active { transform:translate(3px,3px); box-shadow:none; }
  button.primary { display:block; width:100%; max-width:560px; margin:0 auto 18px;
                   padding:16px; font-size:14px; letter-spacing:.28em;
                   color:var(--slip); background:var(--ink); }
  .remove { box-shadow:none; border-width:1px; border-color:var(--rule);
            color:var(--faint); padding:7px 10px; font-size:9.5px; }

  /* ---- the verdict, rubber-stamped ---- */
  .verdict { display:inline-block; margin:2px 0 10px; padding:9px 14px;
             font-size:14px; font-weight:800; line-height:1.25;
             letter-spacing:.1em; text-transform:uppercase;
             border:3px double currentColor; transform:rotate(-2.2deg);
             opacity:.94; }
  .good { color:var(--good); } .warn { color:var(--warn); } .bad { color:var(--bad); }

  /* ---- tabulated like a printed slip ---- */
  table { width:100%; border-collapse:collapse; font-size:12px; margin-top:10px; }
  th, td { text-align:left; padding:7px 4px; border-bottom:1px dashed var(--rule); }
  th { font-size:9.5px; letter-spacing:.14em; text-transform:uppercase;
       color:var(--faint); font-weight:400; border-bottom:1px solid var(--ink); }
  td.num { text-align:right; font-variant-numeric:tabular-nums; font-weight:600; }
  strong { font-size:10px; letter-spacing:.18em; text-transform:uppercase; }

  .note { font-size:11px; color:var(--faint); margin-top:10px; }
  .note.assumed { color:var(--bad); border-left:3px solid var(--bad);
                  padding:4px 0 4px 9px; }
  .check { display:flex; align-items:center; gap:9px; margin:0; padding:3px 0;
           font-size:10px; letter-spacing:.12em; text-transform:uppercase;
           color:var(--ink); cursor:pointer; }
  /* the de-widgeting above would erase a checkbox entirely, so opt it back in */
  .check input[type=checkbox] {
    -webkit-appearance:checkbox; appearance:checkbox;
    width:16px; height:16px; flex:0 0 auto; padding:0;
    accent-color:var(--ink); border-bottom:0; }
  .hidden { display:none; }
</style>
</head>
<body>

<div class="head">
  <div class="swell"></div>
  <h1>Hedge<span class="mk">master</span></h1>
  <div class="meta">
    <span>Slip No.&nbsp;<b id="slipNo">000000</b></span>
    <span class="orn">◆ ◆ ◆</span>
    <span>American odds</span>
  </div>
</div>

<div class="card">
  <div class="row2">
    <div><label for="stake">Stake ($)</label>
      <input id="stake" type="number" value="10" min="0" step="0.01"></div>
    <div><label for="totalOdds">Total odds</label>
      <input id="totalOdds" type="number" placeholder="+1228"></div>
  </div>
  <div class="note">Total odds exactly as your slip shows them — the boosted
    number if it was boosted.</div>
  <label for="cashOut" class="spaced">Cash-out offer ($) · optional</label>
  <input id="cashOut" type="number" min="0" step="0.01" placeholder="Leave blank if none">
</div>

<div class="card">
  <strong>Open legs</strong>
  <div class="note">Only the legs still to be decided — the ones that already
    hit are baked into your total odds.</div>
  <div id="legs"></div>
  <button id="addLeg">+ Add leg</button>
</div>

<button class="primary" id="analyze">Analyze</button>

<div id="results" class="hidden"></div>

<script src="hedge-engine.js"></script>
<script>
const legsEl = document.getElementById('legs');

function addLeg(label = '') {
  const wrap = document.createElement('div');
  wrap.className = 'leg';
  wrap.innerHTML = `
    <div class="full legno"></div>
    <div class="full"><label>Description</label>
      <input class="leg-label" placeholder="e.g. Chiefs ML"></div>
    <div class="full">
      <label class="check"><input type="checkbox" class="leg-assume">
        Treat as won (not final)</label>
    </div>
    <div class="full hedge-box">
      <div class="row2">
        <div><label>Odds against it now</label>
          <input class="leg-hedge" type="number" placeholder="+150"></div>
        <div><label>Available?</label>
          <select class="leg-hedgeable">
            <option value="yes">Can bet it</option>
            <option value="no">No line</option>
          </select></div>
      </div>
    </div>
    <div class="full"><button class="remove">Remove leg</button></div>`;
  wrap.querySelector('.leg-label').value = label;
  wrap.querySelector('.remove').onclick = () => wrap.remove();
  // Assuming a leg won means we're not hedging it, so its hedge inputs go
  // away. Values typed there survive, since hiding doesn't clear them.
  const sync = () => {
    wrap.querySelector('.hedge-box').classList.toggle(
      'hidden', wrap.querySelector('.leg-assume').checked);
  };
  wrap.querySelector('.leg-assume').onchange = sync;
  sync();
  legsEl.appendChild(wrap);
}

document.getElementById('addLeg').onclick = () => addLeg();
addLeg();

document.getElementById('slipNo').textContent =
  String(Math.floor(Math.random() * 1e6)).padStart(6, '0');

// Leg descriptions are user input and get interpolated into markup below.
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({
  '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
}[c]));
const money = (n) => (n < 0 ? '-$' : '$') + Math.abs(n).toFixed(2);
const american = (n) => (n > 0 ? '+' : '') + n;

function readLegs() {
  return [...legsEl.querySelectorAll('.leg')].map((row) => ({
    label: row.querySelector('.leg-label').value.trim() || 'Leg',
    hedgeAmericanOdds: Number(row.querySelector('.leg-hedge').value),
    hedgeable: row.querySelector('.leg-hedgeable').value === 'yes',
    assumeWin: row.querySelector('.leg-assume').checked,
  }));
}

function render(result, legs, assumed = [], ctx = {}) {
  const box = document.getElementById('results');
  box.classList.remove('hidden');

  // Every result computed while a leg is merely assumed is conditional on that
  // leg actually hitting, so it must never be worded like a real guarantee.
  // The won case matters most: assuming every remaining live leg legitimately
  // makes analyze() return 'won', but nothing has actually finished.
  const projected = assumed.length > 0;
  // An assumption hides an entire branch of outcomes from analyze(): the
  // assumed leg missing. In that branch the parlay dies AND every hedge placed
  // on the other legs can still lose, so the real worst case is the stake plus
  // all hedge stakes -- typically far worse than the floor shown, and worse
  // than not hedging at all. No copy below may imply otherwise.
  const assumedMissWorst = -(result.stake + result.totalHedgeStake);
  const headline = {
    guaranteed: [
      projected
        ? `Projected guaranteed profit: ${money(result.floor)}`
        : `Guaranteed profit: ${money(result.floor)}`,
      'good',
    ],
    'reduces-downside': [
      projected
        ? 'Projected — no guarantee, but hedging cuts your downside'
        : 'No guarantee — but hedging cuts your downside',
      'warn',
    ],
    'no-hedge': [
      projected
        ? 'Projected — no guaranteed profit. Don\'t hedge.'
        : 'No guaranteed profit. Don\'t hedge.',
      'bad',
    ],
    won: [
      projected
        ? `Projected win: ${money(result.floor)} profit.`
        : `Parlay won: ${money(result.floor)} profit.`,
      'good',
    ],
  }[result.verdict];

  let html = `<div class="card">
    <div class="verdict ${headline[1]}">${headline[0]}</div>
    <div class="note">Payout at ${american(ctx.totalOdds)}:
      ${money(result.payout)} — should match your slip.</div>`;

  if (projected) {
    // Only speak of hedges dying when hedges are actually being recommended;
    // with none placed, the downside is just the stake and there is nothing
    // for it to be "worse than not hedging" than.
    const downside = result.totalHedgeStake > 0
      ? `the parlay dies and the hedges below die with it — as bad as
         ${money(assumedMissWorst)}, worse than not hedging at all`
      : `the parlay is dead and you lose your ${money(-assumedMissWorst)} stake`;
    html += `<div class="note assumed">Assumes these still-live legs hit:
      ${assumed.map((l) => esc(l.label)).join(', ')}. If that's wrong,
      ${downside}. Nothing above is locked in until they actually land.</div>`;
  }

  if (result.verdict === 'reduces-downside') {
    // Unprojected, both figures are unconditional and directly comparable.
    // Projected, the floor is conditional on the assumed legs landing while
    // the do-nothing figure is not, so they must not be set against each
    // other as if they were the same kind of number.
    html += projected
      ? `<div class="note">If the assumed legs hit, worst case is
         ${money(result.floor)} versus ${money(-result.stake)} unhedged. If
         they don't, see above — hedging costs you more than sitting out.</div>`
      : `<div class="note">Worst case with the hedge: ${money(result.floor)},
         versus ${money(-result.stake)} if you do nothing.</div>`;
  }
  if (result.verdict === 'no-hedge' && result.reason === 'unhedgeable') {
    // Distinguish "you told me this leg has no line" from "you haven't
    // entered odds yet" and name the specific leg(s) -- with 2+ live legs a
    // single generic sentence leaves the user unable to tell which input is
    // the problem, and the two causes need different fixes from the user.
    const issues = legs
      .map((l) => {
        const validOdds =
          Number.isFinite(l.hedgeAmericanOdds) && Math.abs(l.hedgeAmericanOdds) >= 100;
        if (l.hedgeable === false) return `${esc(l.label)}: no line available`;
        if (!validOdds) return `${esc(l.label)}: enter odds, or mark it unavailable`;
        return null;
      })
      .filter(Boolean);
    html += `<div class="note">Can't hedge yet:<br>${issues.join('<br>')}</div>`;
  } else if (result.verdict === 'no-hedge') {
    html += `<div class="note">Your hedge prices imply
      ${(result.impliedTotal * 100).toFixed(1)}% — above 100%, so no stake
      improves your worst case.</div>`;
  }
  html += `</div>`;

  if (result.cashOut) {
    const { offer, hedgeReturn, edge } = result.cashOut;
    const placed = result.hedges.filter((h) => h.stake > 0).length;
    let line;
    if (hedgeReturn <= 0) {
      line = `Hedging can't lock anything in here, so cashing out is your only
        guaranteed exit.`;
    } else if (Math.abs(edge) < 0.005) {
      line = 'About even.';
    } else if (edge > 0) {
      line = `Hedging locks in ${money(edge)} more${placed >= 2
        ? ', and pays beyond that if two or more of these legs miss' : ''}.`;
    } else {
      line = `Cashing out locks in ${money(-edge)} more than the best hedge.`;
    }
    // The effort caveat only makes sense when there are hedges to place.
    const friction = placed > 0
      ? ` Hedging means placing every bet below at those prices before they
         move; cashing out is one tap.`
      : '';
    html += `<div class="card"><strong>Cash out or hedge?</strong>
      <table>
        <tr><td>Cash out now</td><td class="num">${money(offer)}</td></tr>
        <tr><td>Hedge, guaranteed</td><td class="num">${money(hedgeReturn)}</td></tr>
      </table>
      <div class="note">${line} Both are what you walk away with from
        here.${friction}</div></div>`;
  } else if (ctx.cashOutEntered && assumed.length > 0) {
    // The offer is priced on the real bet, risk of the assumed legs included;
    // the projected hedge isn't, so setting them side by side would flatter
    // hedging. Say why the comparison is missing rather than dropping it.
    html += `<div class="card"><strong>Cash out or hedge?</strong>
      <div class="note">Off while legs are treated as won: the cash-out offer
        still prices in the chance those legs miss, and the projected hedge
        doesn't, so comparing them would make hedging look better than it
        is.</div></div>`;
  }

  if (result.hedges.some((h) => h.stake > 0)) {
    html += `<div class="card"><strong>Bet these now</strong>
      <table><tr><th>Against</th><th>Price</th><th class="num">Stake</th></tr>`;
    result.hedges.forEach((h) => {
      html += `<tr><td>${esc(h.label)}</td><td>${american(h.americanOdds)}</td>
        <td class="num">${money(h.stake)}</td></tr>`;
    });
    html += `<tr><td colspan="2"><strong>Total</strong></td>
      <td class="num"><strong>${money(result.totalHedgeStake)}</strong></td></tr></table>
      <div class="note">Each stake is sized so that whichever
      ${projected ? 'of the legs above' : 'leg'} busts, that bet alone returns
      your entire parlay payout.</div></div>`;
  }

  if (result.scenarios.length) {
    html += `<div class="card"><strong>${projected
      ? 'Every outcome if the assumed legs hit' : 'Every outcome'}</strong>
      <table><tr><th>If these miss</th><th class="num">Profit</th>
      <th class="num">From here</th></tr>`;
    result.scenarios.forEach((s) => {
      const who = s.missing.length
        ? s.missing.map(esc).join(', ')
        : 'nothing — all hit';
      const cls = s.profit >= 0 ? 'good' : 'bad';
      html += `<tr><td>${who}</td>
        <td class="num ${cls}">${money(s.profit)}</td>
        <td class="num">${money(s.profitFromHere)}</td></tr>`;
    });
    // The branch analyze() can't see, restored explicitly: a table headed
    // "every outcome" must not quietly omit the only losing one.
    if (projected) {
      html += `<tr><td>an assumed leg misses</td>
        <td class="num bad">${money(assumedMissWorst)}</td>
        <td class="num">${money(assumedMissWorst + result.stake)}</td></tr>`;
    }
    html += `</table><div class="note">"Profit" is net of your original
      ${money(result.stake)} stake; "from here" treats that stake as already
      spent.</div></div>`;
  }

  if (result.thresholds.length) {
    html += `<div class="card"><strong>Prices to watch</strong><table>
      <tr><th>Leg</th><th class="num">Need now</th><th class="num">If last leg</th></tr>`;
    result.thresholds.forEach((t) => {
      const now = t.requiredAmerican === null
        ? 'impossible' : 'better than ' + american(t.requiredAmerican);
      const last = t.downToOneAmerican === null
        ? 'impossible' : 'better than ' + american(t.downToOneAmerican);
      html += `<tr><td>${esc(t.label)}</td><td class="num">${now}</td>
        <td class="num">${last}</td></tr>`;
    });
    html += `</table><div class="note">"If last leg" assumes the other
      undecided legs hit first — usually the moment a guarantee appears.</div></div>`;
  }

  box.innerHTML = html;
}

document.getElementById('analyze').onclick = () => {
  try {
    const stake = Number(document.getElementById('stake').value);
    if (!(stake > 0)) throw new Error('Enter a stake above zero.');
    const totalOdds = Number(document.getElementById('totalOdds').value);
    // A blank field means "no offer", not a $0 offer -- Number('') is 0.
    const cashOutRaw = document.getElementById('cashOut').value.trim();
    const cashOut = cashOutRaw === '' ? null : Number(cashOutRaw);
    if (cashOut !== null && !(cashOut >= 0)) {
      throw new Error('Enter the cash-out offer as a dollar amount, or leave it blank.');
    }
    const legs = readLegs();
    if (!legs.length) throw new Error('Add at least one open leg.');
    // Legs treated as won simply drop out of the hedge set; the on-screen
    // list is untouched, so unchecking restores everything.
    const assumed = legs.filter((l) => l.assumeWin);
    const open = legs.filter((l) => !l.assumeWin);
    const result = analyze({
      stake,
      totalOdds,
      legs: open,
      // Withheld under assumptions -- see the cash-out card in render().
      cashOut: assumed.length ? null : cashOut,
    });
    render(result, open, assumed, { totalOdds, cashOutEntered: cashOut !== null });
  } catch (err) {
    const box = document.getElementById('results');
    box.classList.remove('hidden');
    // Hedge odds are already gated inside analyze(), so the only field that
    // can raise this is total odds -- name it rather than leak the internal
    // message.
    const message = /Invalid American odds/.test(err.message)
      ? 'Enter the parlay\'s total odds exactly as your slip shows them (e.g. +1228) -- American odds must be 100 or more, in either direction.'
      : err.message;
    box.innerHTML =
      `<div class="card"><div class="verdict bad">${esc(message)}</div></div>`;
  }
};
</script>
</body>
</html>
